<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pagina non trovata — LG Coaching</title>
<meta name="robots" content="noindex">
<meta name="description" content="L'indirizzo cercato non esiste. Torna al sito di LG Coaching, Lorenzo Gubertini personal trainer a Buccinasco.">
<link rel="icon" type="image/png" href="img/favicon.png">
<meta name="theme-color" content="#111112">
<style>
@font-face{
  font-family:'Archivo Black';font-style:normal;font-weight:400;font-display:swap;
  src:url('font/archivo-black-400-latin-45f5d4.woff2') format('woff2');
}
:root{ --nero:#08080a; --oro:#d8a445; --oro-chiaro:#f2cf8e; --avorio:#f5f2ec; --grigio:#a3a3a8; }
*,*::before,*::after{box-sizing:border-box;}
body{
  margin:0;min-height:100vh;min-height:100svh;
  display:flex;align-items:center;justify-content:center;
  background:var(--nero);color:var(--avorio);text-align:center;padding:34px 22px;
  font:400 17px/1.65 'Barlow',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
}
.scatola{max-width:520px;}
img.logo{height:104px;width:auto;margin:0 auto 26px;display:block;}
.rombo{width:8px;height:8px;background:var(--oro);transform:rotate(45deg);margin:0 auto 26px;}
h1{
  font-family:'Archivo Black',Impact,sans-serif;font-weight:400;text-transform:uppercase;
  font-size:clamp(28px,6vw,44px);line-height:1.04;letter-spacing:-.012em;
  margin:0 0 16px;text-wrap:balance;
}
p{margin:0 0 30px;color:var(--grigio);text-wrap:pretty;}
a.tasto{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:48px;padding:0 28px;background:var(--oro);color:var(--nero);text-decoration:none;
  font:700 12.5px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;
  transition:background .3s;
}
a.tasto:hover{background:var(--oro-chiaro);}
.sotto{display:block;margin-top:24px;font-size:15px;color:var(--grigio);}
.sotto a{color:var(--oro-chiaro);text-decoration:none;}
</style>
</head>
<body>
  <div class="scatola">
    <img class="logo" src="img/logo-completo.png" alt="Il logo di LG Coaching" width="300" height="420">
    <div class="rombo"></div>
    <h1>Questa pagina&nbsp;non&nbsp;c'è</h1>
    <p>L'indirizzo è&nbsp;stato scritto male, oppure la&nbsp;pagina ha&nbsp;cambiato posto. Il&nbsp;sito però è&nbsp;tutto lì:&nbsp;torna all'inizio e&nbsp;trovi programmi, prezzi&nbsp;e&nbsp;contatti.</p>
    <a class="tasto" href="/">Torna al sito</a>
    <span class="sotto">Oppure scrivimi&nbsp;in&nbsp;direct: <a href="https://www.instagram.com/lorenzo_gubertini" target="_blank" rel="noopener">@lorenzo_gubertini</a></span>
  </div>
</body>
</html>
